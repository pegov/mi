[package]
name = "mi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
similar = "3.2.0"
time = { version = "0.3.55", features = ["formatting", "macros"] }
walkdir = "2.5.0"
